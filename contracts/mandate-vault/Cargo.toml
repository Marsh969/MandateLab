[package]
name = "mandate-vault"
description = "MandateLab single-vault spending-policy contract for an AI agent (NEAR testnet demo)"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/marsh969/mandatelab"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
